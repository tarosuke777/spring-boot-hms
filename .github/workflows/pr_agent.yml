name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: Run PR Agent
    steps:
      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI.API_TYPE: "gemini"
          CONFIG.MODEL: "gemini/gemini-2.5-flash"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
