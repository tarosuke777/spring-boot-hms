// =============================================================================
// 1. Plugins
// =============================================================================
plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.dependency.management)
    alias(libs.plugins.dependency.check)
    id 'jacoco'
    alias(libs.plugins.spotless)
    alias(libs.plugins.errorprone)
    alias(libs.plugins.versions)
}

// =============================================================================
// 2. Project Metadata & Java Toolchain
// =============================================================================
group = 'com.tarosuke777.hms'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// =============================================================================
// 3. Repositories
// =============================================================================
repositories {
    mavenCentral()
}

// =============================================================================
// 4. Dependencies
// =============================================================================
dependencyManagement {
    imports {
        mavenBom libs.spring.ai.bom.get().toString()
        mavenBom libs.spring.cloud.aws.bom.get().toString()
    }
}

dependencies {
    // --- Spring Boot Starters ---
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.thymeleaf
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.data.jpa
    developmentOnly libs.spring.boot.devtools

    // --- AI & Cloud ---
    implementation libs.spring.ai.starter.mcp.server.webmvc
    implementation libs.spring.ai.starter.vector.store.mariadb
    implementation libs.spring.ai.starter.model.ollama

    implementation libs.spring.cloud.aws.starter
    implementation libs.spring.cloud.aws.starter.parameter.store

    // --- Template Engine & UI ---
    implementation libs.thymeleaf.extras.springsecurity6
    implementation libs.thymeleaf.layout.dialect
    implementation libs.webjars.locator.core
    implementation libs.webjars.bootstrap
    implementation libs.webjars.jquery
    implementation libs.webjars.jquery.ui

    // --- Persistence & Migration ---
    implementation libs.flyway.core
    implementation libs.flyway.mysql
    runtimeOnly libs.h2
    runtimeOnly libs.mariadb.client

    // --- Utilities ---
    implementation libs.mapstruct

    // --- Lombok & Annotation Processors ---
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    annotationProcessor libs.mapstruct.processor
    annotationProcessor libs.lombok.mapstruct.binding
    annotationProcessor libs.hibernate.jpamodelgen

    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok

    testAnnotationProcessor libs.mapstruct.processor
    testAnnotationProcessor libs.lombok.mapstruct.binding

    // --- Testing ---
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.security.test
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.archunit.junit5
    testImplementation libs.playwright

    // --- Static Analysis Tools ---
    errorprone libs.errorprone.core
}

// =============================================================================
// 5. Plugin Configurations
// =============================================================================
dependencyCheck {
    failBuildOnCVSS = 7.0 // HIGH (高)の脆弱性のみビルドを失敗させる
    suppressionFile = 'config/owasp/suppressions.xml' // 誤検知除外用ファイル
}

spotless {
    java {
        eclipse().configFile project.file("config/formatter/eclipse-java-google-style.xml")

        removeUnusedImports()
        importOrder()
    }

    format 'web', {
        target 'src/main/resources/**/*.html', 'src/main/resources/**/*.css', 'src/main/resources/**/*.js'
        prettier().nodeExecutable("${projectDir}/node_modules/.bin/node").configFile(project.file(".prettierrc"))
    }
}

// =============================================================================
// 6. Standard Task Configurations
// =============================================================================
tasks.withType(JavaCompile) {
    options.compilerArgs += [
        "-Amapstruct.unmappedTargetPolicy=ERROR"
    ]

    options.errorprone {
        // 未使用の変数・パラメータ・フィールドをエラーにする
        check("UnusedVariable", net.ltgt.gradle.errorprone.CheckSeverity.ERROR)

        // 自動生成されたソースコード（build/generated/ 配下）を Error Prone のチェックから除外する
        excludedPaths = ".*/build/generated/.*"
    }
}

tasks.named('compileJava') {
    dependsOn 'setupGitHooks'
}

tasks.named('jar') {
    enabled = false // 通常のJAR（-plain.jar）(ライブラリ用)は作らない
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'

    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')

    reports {
        html.required = true
        xml.required = false
        csv.required = true
    }
}

// =============================================================================
// 7. Custom Tasks
// =============================================================================
tasks.register('setupGitHooks') {
    doLast {
        def gitExists = false
        try {
            def process = new ProcessBuilder('git', '--version').start()
            gitExists = (process.waitFor() == 0)
        } catch (Exception ignored) {
            gitExists = false
        }

        if (!gitExists) {
            logger.quiet "⚠️ 'git' コマンドが見つからないため、Gitフックの設定をスキップします。"
            return
        }

        if (file('.githooks').exists()) {
            new ProcessBuilder('git', 'config', 'core.hooksPath', '.githooks')
                .directory(projectDir)
                .start()
                .waitFor()

            if (!System.getProperty("os.name").toLowerCase().contains("windows")) {
                new ProcessBuilder('chmod', '+x', '.githooks/pre-commit')
                    .directory(projectDir)
                    .start()
                    .waitFor()
            }
            logger.quiet "✅ Git hooks path successfully configured to .githooks"
        }
    }
}