spring:
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:13306/hms}
    driver-class-name: org.mariadb.jdbc.Driver
    username: hms
    password: ${mysql_user_password}
  flyway:
    locations: classpath:db/migration/ddl,classpath:db/migration/hv
    baseline-on-migrate: true
    baseline-version: 0
  h2:
    console:
      enabled: false
  ai:
    vector-store:
      mariadb:
        initialize-schema: true

app:
  services:
    videos-url: http://192.168.10.199:8080/videos/

webauthn:
  rp-name: "HMS App"
  rp-id: "hms.home.arpa"
  allowed-origins: "https://hms.home.arpa"

jwt:
  secret: ${jwt_secret}
