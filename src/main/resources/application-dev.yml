spring:
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:13306/hms}
    driver-class-name: org.mariadb.jdbc.Driver
    username: hms
    password: ${mysql_user_password}
  flyway:
    locations: classpath:db/migration/ddl
    baseline-on-migrate: true
    baseline-version: 0
  h2:
    console:
      enabled: false
  ai:
    vector-store:
      mariadb:
        initialize-schema: true

webauthn:
  rp-name: "HMS App"
  rp-id: "hms.home.arpa"
  allowed-origins: "https://hms.home.arpa"

jwt:
  secret: ${jwt_secret}

springdoc:
  swagger-ui:
    # 必要であればここを調整
  api-docs:
    path: /v3/api-docs
  # ここでサーバーのURLを強制指定する
  servers:
    - url: https://hms.home.arpa
      description: Production server (https)
    - url: http://hms.home.arpa
      description: Production server (http)
