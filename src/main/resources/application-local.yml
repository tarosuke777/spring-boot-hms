spring:
  thymeleaf:
      cache: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    locations: classpath:db/migration/ddl,classpath:db/migration/data
  h2:
    console:
      enabled: true
  ai:
    vector-store:
      mariadb:
        initialize-schema: false

webauthn:
  rp-name: "HMS App (Local)"
  rp-id: "localhost"
  allowed-origins: "http://localhost:8080"

jwt:
  # 32バイト以上の固定ダミーキー（HS256要件を満たすもの）
  secret: "local-dev-dummy-secret-key-must-be-at-least-32-chars-long"
