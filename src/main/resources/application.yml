spring:
  application:
    name: hms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  messages:
    basename: ValidationMessages
  flyway:
    enabled: true
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  cloud:
    aws:
      parameterstore:
        enabled: false
  ai:
    mcp:
      server:
        base-url: /hms
    ollama:
      base-url: ${SPRING_AI_MODEL_HOST:http://192.168.10.11:11434}
      embedding:
        options:
          model: nomic-embed-text
server:
  servlet:
    session:
      timeout: 8h

# logging:
#   level:
#     # Spring Security の内部処理・認証・フィルターログ
#     org.springframework.security: DEBUG
#     # HTTPリクエストの受け渡しの詳細ログ
#     org.springframework.web: DEBUG
#     # WebAuthn（パスキー）関連処理に絞ったログ
#     org.springframework.security.web.webauthn: TRACE
#     # Hibernate SQLのプレースホルダー(?)に入るパラメータ値を出力
#     org.hibernate.orm.jdbc.bind: TRACE
#     # 独自サービス（WebAuthnServiceのlog.info出力用）
#     com.tarosuke777.hms: DEBUG

app:
  base-domain: home.arpa

  services:
    chat-url: https://hc.${app.base-domain}/
    blog-url: https://hb.${app.base-domain}/
    videos-url: https://hv.${app.base-domain}/videos/
    books-url: https://hv.${app.base-domain}/books/
    jenkins-url: https://jnk.${app.base-domain}/
    grafana-url: https://grf.${app.base-domain}/
    adguardhome-url: https://adg.${app.base-domain}/

jwt:
  access-token-expiration-ms: 86400000 # 1日 (ミリ秒) 
  refresh-token-expiration-ms: 2592000000 # 30日 (ミリ秒)
