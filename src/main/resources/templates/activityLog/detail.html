<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>活動ログ詳細</title>
    <script>
      $(function () {
        $("#jsiDatepicker").datepicker({
          dateFormat: "yy-mm-dd",
        });

        const targetType = $("#targetType");
        const bookSelect = $("#bookTargetId");
        const videoSelect = $("#videoTargetId");
        const gameVideoSelect = $("#gameVideoTargetId");
        const targetSelects = {
          BOOK: bookSelect,
          VIDEO: videoSelect,
          GAME_VIDEO: gameVideoSelect,
        };
        const updateTargetSelect = () => {
          Object.entries(targetSelects).forEach(([type, select]) => {
            const isSelectedType = targetType.val() === type;
            select
              .prop("hidden", !isSelectedType)
              .prop("disabled", !isSelectedType);
          });
        };
        targetType.on("change", () => {
          Object.values(targetSelects).forEach((select) => select.val(""));
          updateTargetSelect();
        });
        updateTargetSelect();
      });
    </script>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2">活動ログ詳細</h1>
      </div>

      <form
        th:action="@{/activityLog/detail}"
        th:object="${activityLogForm}"
        method="post"
        class="row g-3"
      >
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{version}" />

        <div class="col-md-6">
          <label for="jsiDatepicker" class="form-label">活動日</label>
          <input
            type="date"
            id="jsiDatepicker"
            class="form-control"
            name="activityDate"
            th:value="${activityLogForm.activityDate != null ? #temporals.format(activityLogForm.activityDate, 'yyyy-MM-dd') : ''}"
            th:errorclass="is-invalid"
          />
          <div class="invalid-feedback" th:errors="*{activityDate}"></div>
        </div>

        <div class="col-md-6">
          <label for="targetType" class="form-label">対象種別</label>
          <select
            id="targetType"
            class="form-select"
            th:field="*{targetType}"
            th:errorclass="is-invalid"
          >
            <option value="">選択してください</option>
            <option
              th:each="type : ${activityLogTargetTypes}"
              th:value="${type}"
              th:text="${type.label}"
            ></option>
          </select>
          <div class="invalid-feedback" th:errors="*{targetType}"></div>
        </div>

        <div class="col-md-6">
          <label for="bookTargetId" class="form-label">対象タイトル</label>
          <select
            id="bookTargetId"
            name="targetId"
            class="form-select"
            th:classappend="${#fields.hasErrors('targetId')} ? 'is-invalid'"
            th:disabled="${activityLogForm.targetType != 'BOOK'}"
            th:hidden="${activityLogForm.targetType != 'BOOK'}"
          >
            <option value="">書籍を選択してください</option>
            <option
              th:each="book : ${bookMap}"
              th:value="${book.key}"
              th:text="${book.value}"
              th:selected="${activityLogForm.targetType == 'BOOK' and activityLogForm.targetId == book.key}"
            ></option>
          </select>
          <select
            id="videoTargetId"
            name="targetId"
            class="form-select"
            th:classappend="${#fields.hasErrors('targetId')} ? 'is-invalid'"
            th:disabled="${activityLogForm.targetType != 'VIDEO'}"
            th:hidden="${activityLogForm.targetType != 'VIDEO'}"
          >
            <option value="">動画を選択してください</option>
            <option
              th:each="movie : ${movieMap}"
              th:value="${movie.key}"
              th:text="${movie.value}"
              th:selected="${activityLogForm.targetType == 'VIDEO' and activityLogForm.targetId == movie.key}"
            ></option>
          </select>
          <select
            id="gameVideoTargetId"
            name="targetId"
            class="form-select"
            th:classappend="${#fields.hasErrors('targetId')} ? 'is-invalid'"
            th:disabled="${activityLogForm.targetType != 'GAME_VIDEO'}"
            th:hidden="${activityLogForm.targetType != 'GAME_VIDEO'}"
          >
            <option value="">ゲーム動画を選択してください</option>
            <option
              th:each="gameVideo : ${gameVideoMap}"
              th:value="${gameVideo.key}"
              th:text="${gameVideo.value}"
              th:selected="${activityLogForm.targetType == 'GAME_VIDEO' and activityLogForm.targetId == gameVideo.key}"
            ></option>
          </select>
          <div class="invalid-feedback" th:errors="*{targetId}"></div>
        </div>

        <div class="col-12">
          <label for="memo" class="form-label">メモ</label>
          <textarea
            id="memo"
            class="form-control"
            rows="6"
            th:field="*{memo}"
            maxlength="2000"
          ></textarea>
          <div th:if="${#fields.hasErrors('memo')}" class="text-danger small">
            <span th:errors="*{memo}"></span>
          </div>
        </div>

        <div class="col-12 d-flex gap-2">
          <button
            type="submit"
            name="update"
            value="update"
            class="btn btn-dark"
          >
            更新
          </button>
          <button
            type="submit"
            name="delete"
            value="delete"
            class="btn btn-danger"
          >
            削除
          </button>
          <a th:href="@{/activityLog/list}" class="btn btn-secondary"
            >一覧へ戻る</a
          >
        </div>
      </form>
    </div>
  </body>
</html>
