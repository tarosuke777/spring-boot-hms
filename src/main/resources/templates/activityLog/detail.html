<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>活動ログ詳細</title>
    <script>
      $(function () {
        $("#jsiDatepicker").datepicker({
          dateFormat: "yy-mm-dd",
        });
      });
    </script>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2">活動ログ詳細</h1>
      </div>

      <form
        th:action="@{/activityLog/detail}"
        th:object="${activityLogForm}"
        method="post"
        class="row g-3"
      >
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{version}" />

        <div class="col-md-6">
          <label for="jsiDatepicker" class="form-label">活動日</label>
          <input
            type="date"
            id="jsiDatepicker"
            class="form-control"
            name="activityDate"
            th:value="${activityLogForm.activityDate != null ? #temporals.format(activityLogForm.activityDate, 'yyyy-MM-dd') : ''}"
            th:errorclass="is-invalid"
          />
          <div class="invalid-feedback" th:errors="*{activityDate}"></div>
        </div>

        <div class="col-md-6">
          <label for="targetType" class="form-label">対象種別</label>
          <select
            id="targetType"
            class="form-select"
            th:field="*{targetType}"
            th:errorclass="is-invalid"
          >
            <option value="">選択してください</option>
            <option
              th:each="type : ${activityLogTargetTypes}"
              th:value="${type}"
              th:text="${type.label}"
            ></option>
          </select>
          <div class="invalid-feedback" th:errors="*{targetType}"></div>
        </div>

        <div class="col-md-6">
          <label for="targetId" class="form-label">対象ID</label>
          <input
            type="number"
            id="targetId"
            class="form-control"
            th:field="*{targetId}"
            th:errorclass="is-invalid"
            min="1"
          />
          <div class="invalid-feedback" th:errors="*{targetId}"></div>
        </div>

        <div class="col-12">
          <label for="memo" class="form-label">メモ</label>
          <textarea
            id="memo"
            class="form-control"
            rows="6"
            th:field="*{memo}"
            maxlength="2000"
          ></textarea>
          <div th:if="${#fields.hasErrors('memo')}" class="text-danger small">
            <span th:errors="*{memo}"></span>
          </div>
        </div>

        <div class="col-12 d-flex gap-2">
          <button
            type="submit"
            name="update"
            value="update"
            class="btn btn-dark"
          >
            更新
          </button>
          <button
            type="submit"
            name="delete"
            value="delete"
            class="btn btn-danger"
          >
            削除
          </button>
          <a th:href="@{/activityLog/list}" class="btn btn-secondary"
            >一覧へ戻る</a
          >
        </div>
      </form>
    </div>
  </body>
</html>
