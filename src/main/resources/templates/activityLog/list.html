<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>活動ログ</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2">活動ログ</h1>
      </div>

      <div class="mb-4">
        <a class="btn btn-dark" th:href="@{/activityLog/register}">新規登録</a>
      </div>

      <div
        th:replace="~{parts/pagination :: pagination(page=${activityLogPage})}"
      ></div>

      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr class="table-dark">
              <th>活動日</th>
              <th>対象種別</th>
              <th>対象ID</th>
              <th>メモ</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="log : ${activityLogPage.content}">
              <td>
                <a
                  th:href="@{/activityLog/detail/{id}(id=${log.id})}"
                  th:text="${#temporals.format(log.activityDate, 'yyyy-MM-dd')}"
                  class="text-decoration-none"
                ></a>
              </td>
              <td th:text="${log.targetType}"></td>
              <td th:text="${log.targetId}"></td>
              <td class="text-break" th:text="${log.memo}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
