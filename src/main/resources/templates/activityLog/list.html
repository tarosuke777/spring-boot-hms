<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>活動ログ</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2">活動ログ</h1>
      </div>

      <div class="mb-4">
        <a class="btn btn-dark" th:href="@{/activityLog/register}">新規登録</a>
      </div>

      <div
        th:replace="~{parts/pagination :: pagination(page=${activityLogPage})}"
      ></div>

      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr class="table-dark">
              <th>活動日</th>
              <th>対象種別</th>
              <th>対象</th>
              <th>メモ</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="log : ${activityLogPage.content}">
              <td>
                <a
                  th:href="@{/activityLog/detail/{id}(id=${log.id})}"
                  th:text="${#temporals.format(log.activityDate, 'yyyy-MM-dd')}"
                  class="text-decoration-none"
                ></a>
              </td>
              <td
                th:text="${log.targetType == 'BOOK' ? '書籍' : (log.targetType == 'VIDEO' or log.targetType == 'MOVIE' ? '動画' : (log.targetType == 'GAME_VIDEO' ? 'ゲーム動画' : log.targetType))}"
              ></td>
              <td
                th:with="targetTitle=${log.targetType == 'BOOK' ? bookMap.get(log.targetId) : (log.targetType == 'VIDEO' or log.targetType == 'MOVIE' ? movieMap.get(log.targetId) : (log.targetType == 'GAME_VIDEO' ? gameVideoMap.get(log.targetId) : log.targetId))}"
              >
                <a
                  th:if="${targetTitle != null and log.targetType == 'BOOK'}"
                  th:href="@{/book/detail/{id}(id=${log.targetId})}"
                  th:text="${targetTitle}"
                  class="text-decoration-none"
                ></a>
                <a
                  th:if="${targetTitle != null and (log.targetType == 'VIDEO' or log.targetType == 'MOVIE')}"
                  th:href="@{/movie/detail/{id}(id=${log.targetId})}"
                  th:text="${targetTitle}"
                  class="text-decoration-none"
                ></a>
                <a
                  th:if="${targetTitle != null and log.targetType == 'GAME_VIDEO'}"
                  th:href="@{/gameVideo/detail/{id}(id=${log.targetId})}"
                  th:text="${targetTitle}"
                  class="text-decoration-none"
                ></a>
                <span
                  th:if="${targetTitle == null or (log.targetType != 'BOOK' and log.targetType != 'VIDEO' and log.targetType != 'MOVIE' and log.targetType != 'GAME_VIDEO')}"
                  th:text="${targetTitle != null ? targetTitle : '-'}"
                >
                  -
                </span>
              </td>
              <td class="text-break" th:text="${log.memo}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
