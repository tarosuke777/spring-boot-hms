<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>アーティスト詳細</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-3 border-bottom">
        <h1 class="h2">アーティスト詳細</h1>
      </div>
      <form
        method="post"
        th:action="@{/artist/detail}"
        th:object="${artistForm}"
      >
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{version}" />
        <div class="mb-3 row">
          <label for="name" class="col-sm-2 col-form-label"
            >アーティスト名</label
          >
          <div class="col-sm-10">
            <input type="text" class="form-control" th:field="*{name}" />
          </div>
        </div>
        <div class="text-center">
          <button class="btn btn-danger" type="submit" name="delete">
            削除する
          </button>
          <button class="btn btn-dark" type="submit" name="update">
            更新する
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
