<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>著者詳細</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-3 border-bottom">
        <h1 class="h2">著者詳細</h1>
      </div>
      <form
        method="post"
        th:action="@{/author/detail}"
        th:object="${authorForm}"
      >
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{version}" />
        <div class="mb-3 row">
          <label for="name" class="col-sm-2 col-form-label">著者名</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" th:field="*{name}" />
          </div>
        </div>
        <div class="text-center">
          <button class="btn btn-danger" type="submit" name="delete">
            削除する
          </button>
          <button class="btn btn-dark" type="submit" name="update">
            更新する
          </button>
        </div>
      </form>
      <div class="mt-3 mb-3 border-bottom">
        <h2 class="h4">関連書籍</h2>
      </div>

      <div class="row align-items-center mb-4 g-3">
        <div class="col-auto">
          <a
            class="btn btn-dark"
            th:href="@{/book/register(authorId=${authorForm.id})}"
            >新規登録</a
          >
        </div>
      </div>
      <div th:if="${books.isEmpty()}">
        <p class="text-muted">この著者に紐づく書籍はありません</p>
      </div>
      <div th:unless="${books.isEmpty()}">
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr class="table-dark">
              <th>書籍名</th>
              <th>リンク</th>
              <th>備考</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="book: ${books}">
              <td th:text="${book.name}"></td>
              <td class="text-center">
                <a
                  th:if="${not #strings.isEmpty(book.link)}"
                  th:href="${book.link}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="btn btn-sm btn-link"
                  >リンク</a
                >
                <span th:unless="${not #strings.isEmpty(book.link)}">-</span>
              </td>
              <td
                class="text-truncate modal-trigger"
                style="max-width: 200px; cursor: pointer"
                data-bs-toggle="modal"
                data-bs-target="#globalModal"
                th:if="${not #strings.isEmpty(book.note)}"
                th:data-modal-text="${book.note}"
                data-modal-title="備考"
              >
                <span th:text="${book.note}"></span>
              </td>
              <td th:unless="${not #strings.isEmpty(book.note)}">-</td>
            </tr>
          </tbody>
        </table>
      </div>
      <th:block th:replace="~{parts/parts :: globalModal }"></th:block>
    </div>
  </body>
</html>
