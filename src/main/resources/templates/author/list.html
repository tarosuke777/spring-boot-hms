<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>Author</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2 mb-3">Book Management</h1>

        <!-- タブメニュー -->
        <ul class="nav nav-pills">
          <li class="nav-item">
            <a class="nav-link text-dark" th:href="@{/book/list}">Book</a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link active bg-dark text-white"
              th:href="@{/author/list}"
              >Author</a
            >
          </li>
        </ul>
      </div>

      <div>
        <div class="mb-2">
          <a class="btn btn-dark" th:href="@{'/author/register'}">新規登録</a>
        </div>

        <div
          th:replace="~{parts/pagination :: pagination(page=${authorPage})}"
        ></div>

        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr class="table-dark">
              <th>Name</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="author: ${authorPage.content}">
              <td>
                <a
                  th:href="@{'/author/detail/' + ${author.id}}"
                  th:text="${author.name}"
                  class="text-decoration-none"
                ></a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
