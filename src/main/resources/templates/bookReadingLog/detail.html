<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>読書履歴詳細</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2">読書履歴詳細</h1>
      </div>

      <form
        th:action="@{/bookReadingLog/detail}"
        th:object="${bookReadingLogForm}"
        method="post"
        class="row g-3"
      >
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{version}" />

        <div class="col-md-6">
          <label for="bookId" class="form-label">書籍</label>
          <select id="bookId" class="form-select" th:field="*{bookId}">
            <option value="" selected>選択してください</option>
            <option
              th:each="entry : ${bookMap}"
              th:value="${entry.key}"
              th:text="${entry.value}"
              th:selected="${entry.key == bookReadingLogForm.bookId}"
            ></option>
          </select>
          <div th:if="${#fields.hasErrors('bookId')}" class="text-danger small">
            <span th:errors="*{bookId}"></span>
          </div>
        </div>

        <div class="col-md-6">
          <label for="readDate" class="form-label">読んだ日</label>
          <input
            type="date"
            id="readDate"
            class="form-control"
            th:field="*{readDate}"
          />
          <div
            th:if="${#fields.hasErrors('readDate')}"
            class="text-danger small"
          >
            <span th:errors="*{readDate}"></span>
          </div>
        </div>

        <div class="col-12">
          <label for="memo" class="form-label">メモ</label>
          <textarea
            id="memo"
            class="form-control"
            rows="6"
            th:field="*{memo}"
          ></textarea>
          <div th:if="${#fields.hasErrors('memo')}" class="text-danger small">
            <span th:errors="*{memo}"></span>
          </div>
        </div>

        <div class="col-12 d-flex gap-2">
          <button type="submit" name="update" class="btn btn-dark">更新</button>
          <button type="submit" name="delete" class="btn btn-outline-danger">
            削除
          </button>
          <a th:href="@{/bookReadingLog/list}" class="btn btn-secondary"
            >一覧へ戻る</a
          >
        </div>
      </form>
    </div>
  </body>
</html>
