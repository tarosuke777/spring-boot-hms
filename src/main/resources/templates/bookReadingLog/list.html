<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>読書履歴</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2 mb-3">書籍管理</h1>

        <ul class="nav nav-pills">
          <li class="nav-item">
            <a class="nav-link text-dark" th:href="@{/book/list}">書籍</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-dark" th:href="@{/author/list}">著者</a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link active bg-dark text-white"
              th:href="@{/bookReadingLog/list}"
              >読書履歴</a
            >
          </li>
        </ul>
      </div>

      <div class="mb-4">
        <a class="btn btn-dark" th:href="@{'/bookReadingLog/register'}"
          >新規登録</a
        >
      </div>

      <div
        th:replace="~{parts/pagination :: pagination(page=${bookReadingLogPage})}"
      ></div>

      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr class="table-dark">
              <th>読んだ日</th>
              <th>書籍名</th>
              <th>メモ</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="log: ${bookReadingLogPage.content}">
              <td>
                <a
                  th:href="@{'/bookReadingLog/detail/' + ${log.id}}"
                  th:text="${#temporals.format(log.readDate, 'yyyy-MM-dd')}"
                  class="text-decoration-none"
                ></a>
              </td>
              <td>
                <a
                  th:href="@{'/book/detail/' + ${log.bookId}}"
                  th:text="${bookMap.get(log.bookId)}"
                  class="text-decoration-none"
                ></a>
              </td>
              <td th:text="${log.memo}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
