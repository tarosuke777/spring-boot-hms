<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>コーディング履歴詳細</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2">コーディング履歴詳細</h1>
      </div>

      <form
        th:action="@{/codingLog/detail}"
        th:object="${codingLogForm}"
        method="post"
        class="row g-3"
      >
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{version}" />

        <div class="col-md-6">
          <label for="solvedDate" class="form-label">解いた日</label>
          <input
            type="date"
            id="solvedDate"
            class="form-control"
            th:field="*{solvedDate}"
            th:errorclass="is-invalid"
          />
          <div class="invalid-feedback" th:errors="*{solvedDate}"></div>
        </div>

        <div class="col-12">
          <label for="problemUrl" class="form-label">問題URL</label>
          <input
            type="url"
            id="problemUrl"
            class="form-control"
            th:field="*{problemUrl}"
            th:errorclass="is-invalid"
            maxlength="512"
          />
          <div class="invalid-feedback" th:errors="*{problemUrl}"></div>
        </div>

        <div class="col-12">
          <label for="memo" class="form-label">メモ</label>
          <textarea
            id="memo"
            class="form-control"
            rows="6"
            th:field="*{memo}"
            maxlength="2000"
          ></textarea>
          <div th:if="${#fields.hasErrors('memo')}" class="text-danger small">
            <span th:errors="*{memo}"></span>
          </div>
        </div>

        <div class="col-12 d-flex gap-2">
          <button type="submit" name="update" class="btn btn-dark">更新</button>
          <button type="submit" name="delete" class="btn btn-outline-danger">
            削除
          </button>
          <a th:href="@{/codingLog/list}" class="btn btn-secondary"
            >一覧へ戻る</a
          >
        </div>
      </form>
    </div>
  </body>
</html>
