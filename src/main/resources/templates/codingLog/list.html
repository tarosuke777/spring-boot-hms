<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>コーディング履歴</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2">コーディング履歴</h1>
      </div>

      <div class="mb-4">
        <a class="btn btn-dark" th:href="@{/codingLog/register}">新規登録</a>
      </div>

      <div
        th:replace="~{parts/pagination :: pagination(page=${codingLogPage})}"
      ></div>

      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr class="table-dark">
              <th>解いた日</th>
              <th>問題URL</th>
              <th>メモ</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="log : ${codingLogPage.content}">
              <td>
                <a
                  th:href="@{/codingLog/detail/{id}(id=${log.id})}"
                  th:text="${#temporals.format(log.solvedDate, 'yyyy-MM-dd')}"
                  class="text-decoration-none"
                ></a>
              </td>
              <td>
                <a
                  th:href="${log.problemUrl}"
                  th:text="${log.problemUrl}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="text-break"
                ></a>
              </td>
              <td class="text-break" th:text="${log.memo}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
