<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <th:block layout:fragment="page-scripts">
      <script type="module" th:src="@{/js/common/modal.js}"></script>
    </th:block>
    <title>Company</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-3 border-bottom">
        <h1 class="h2">Company</h1>
      </div>
      <div class="row align-items-center mb-4 g-3">
        <div class="col-auto">
          <a class="btn btn-dark" th:href="@{'/company/register'}">Register</a>
        </div>

        <div class="col">
          <form
            th:action="@{/company/list}"
            method="get"
            class="row g-2 align-items-center"
          >
            <div class="col-auto">
              <input
                type="text"
                class="form-control"
                name="name"
                placeholder="Name"
                th:value="${name}"
              />
            </div>

            <div class="col-auto">
              <button type="submit" class="btn btn-dark">検索</button>
              <a th:href="@{/company/list}" class="btn btn-secondary"
                >リセット</a
              >
            </div>
          </form>
        </div>
      </div>

      <div
        th:replace="~{parts/pagination :: pagination(page=${companyPage})}"
      ></div>

      <div>
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr class="table-dark">
              <th>Name</th>
              <th>Note</th>
              <th>Job Application History</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="company: ${companyPage.content}">
              <td>
                <a
                  th:href="@{'/company/detail/' + ${company.id}}"
                  th:text="${company.name}"
                  class="text-decoration-none"
                ></a>
              </td>

              <td
                class="text-truncate modal-trigger"
                style="max-width: 500px; cursor: pointer"
                data-bs-toggle="modal"
                data-bs-target="#globalModal"
                th:data-modal-text="${company.note}"
                data-modal-title="Note"
              >
                <span th:text="${company.note}"></span>
              </td>
              <td
                class="text-truncate modal-trigger"
                style="max-width: 500px; cursor: pointer"
                data-bs-toggle="modal"
                data-bs-target="#globalModal"
                th:data-modal-text="${company.jobApplicationHistory}"
                data-modal-title="Job Application History"
              >
                <span th:text="${company.jobApplicationHistory}"></span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <th:block th:replace="~{parts/parts :: globalModal }"></th:block>
    </div>
  </body>
</html>
