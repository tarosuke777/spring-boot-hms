<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:hms="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>Diary</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-3 border-bottom">
        <h1 class="h2">Diary</h1>
      </div>
      <div>
        <div class="mb-2">
          <a class="btn btn-dark" th:href="@{'/diary/register'}">新規登録</a>
        </div>
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr class="table-dark">
              <th>
                <a th:href="@{/diary/list(orderBy='diary_date', sort='asc')}"
                  >▲</a
                >
                日付
                <a th:href="@{/diary/list(orderBy='diary_date', sort='desc')}"
                  >▼</a
                >
              </th>
              <th>やること（予定）</th>
              <th>やること（実績）</th>
              <th>楽しさ度（予定）</th>
              <th>楽しさ度（実績）</th>
              <th>一言（予定）</th>
              <th>一言（実績）</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="diary: ${diaryList}">
              <td>
                <a
                  th:href="@{'/diary/detail/' + ${diary.diaryId}}"
                  th:text="${#temporals.format(diary.diaryDate, 'yyyy-MM-dd (E)')}"
                  class="text-decoration-none"
                ></a>
              </td>
              <td hms:linebreak="${diary.todoPlan}"></td>
              <td hms:linebreak="${diary.todoActual}"></td>
              <td th:text="${diary.funPlan}"></td>
              <td th:text="${diary.funActual}"></td>
              <td hms:linebreak="${diary.commentPlan}"></td>
              <td hms:linebreak="${diary.commentActual}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
