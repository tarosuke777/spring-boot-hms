<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>ゲーム動画詳細</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-3 border-bottom">
        <h1 class="h2">ゲーム動画詳細</h1>
      </div>

      <div class="mb-3">
        <video
          class="w-100"
          style="max-width: 960px"
          controls
          preload="metadata"
        >
          <source th:src="${gameVideo.videoUrl}" type="video/mp4" />
          お使いのブラウザーは動画再生に対応していません。
        </video>
      </div>

      <dl class="row">
        <dt class="col-sm-2">タイトル</dt>
        <dd class="col-sm-10" th:text="${gameVideo.title}"></dd>
        <dt class="col-sm-2">名前</dt>
        <dd
          class="col-sm-10"
          th:text="${gameVideo.name != null and !#strings.isEmpty(gameVideo.name) ? gameVideo.name : '-'}"
        ></dd>
        <dt class="col-sm-2">ファイル名</dt>
        <dd class="col-sm-10" th:text="${gameVideo.fileName}"></dd>
        <dt class="col-sm-2">登録日時</dt>
        <dd
          class="col-sm-10"
          th:text="${gameVideo.createdAt != null ? #temporals.format(gameVideo.createdAt, 'yyyy/MM/dd HH:mm') : '-'}"
        ></dd>
        <dt class="col-sm-2">更新日時</dt>
        <dd
          class="col-sm-10"
          th:text="${gameVideo.updatedAt != null ? #temporals.format(gameVideo.updatedAt, 'yyyy/MM/dd HH:mm') : '-'}"
        ></dd>
      </dl>

      <div class="text-center">
        <a th:href="@{/gameVideo/list}" class="btn btn-secondary">一覧へ戻る</a>
      </div>
    </div>
  </body>
</html>
