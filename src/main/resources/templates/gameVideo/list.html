<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>ゲーム動画</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1
          class="h2"
          th:text="${selectMode ? 'ゲーム動画を選択' : 'ゲーム動画'}"
        >
          ゲーム動画
        </h1>
        <p th:if="${selectMode}" class="text-muted mb-2">
          プレビューを確認して、活動ログに登録するゲーム動画を選択してください。
        </p>
      </div>

      <form
        th:action="@{/gameVideo/list}"
        method="get"
        class="card card-body mb-4"
      >
        <div class="row g-3 align-items-end">
          <input
            th:if="${selectMode}"
            type="hidden"
            name="select"
            value="true"
          />
          <div class="col-12 col-md-5">
            <label class="form-label" for="game-video-title">タイトル</label>
            <select
              class="form-select"
              id="game-video-title"
              name="title"
              th:data-names-url="@{/gameVideo/names}"
            >
              <option value="">すべてのタイトル</option>
              <option
                th:each="option : ${titles}"
                th:value="${option}"
                th:text="${option}"
                th:selected="${option == title}"
              ></option>
            </select>
          </div>
          <div class="col-12 col-md-5">
            <label class="form-label" for="game-video-name">名前</label>
            <select class="form-select" id="game-video-name" name="name">
              <option value="">すべての名前</option>
              <option
                th:each="option : ${names}"
                th:value="${option}"
                th:text="${option}"
                th:selected="${option == name}"
              ></option>
            </select>
          </div>
          <div class="col-12 col-md-2">
            <button type="submit" class="btn btn-dark">検索</button>
            <a
              th:if="${selectMode}"
              th:href="@{/gameVideo/list(select=true)}"
              class="btn btn-secondary"
              >クリア</a
            >
            <a
              th:unless="${selectMode}"
              th:href="@{/gameVideo/list}"
              class="btn btn-secondary"
              >クリア</a
            >
          </div>
        </div>
        <p
          id="game-video-filter-error"
          class="text-danger mt-2 mb-0"
          role="alert"
          hidden
        ></p>
        <p
          th:if="${selectMode}"
          id="game-video-selection-error"
          class="text-danger mt-2 mb-0"
          role="alert"
          hidden
        ></p>
      </form>

      <div
        th:replace="~{parts/pagination :: pagination(page=${gameVideoPage})}"
      ></div>

      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr class="table-dark">
              <th>プレビュー</th>
              <th>タイトル</th>
              <th>名前</th>
              <th>登録日時</th>
              <th th:if="${selectMode}">選択</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="gameVideo : ${gameVideoPage.content}">
              <td>
                <video
                  class="w-100"
                  style="max-width: 320px"
                  controls
                  preload="metadata"
                >
                  <source th:src="${gameVideo.videoUrl}" type="video/mp4" />
                  お使いのブラウザーは動画再生に対応していません。
                </video>
              </td>
              <td>
                <a
                  class="text-decoration-none"
                  th:href="@{/gameVideo/detail/{id}(id=${gameVideo.id})}"
                  th:text="${gameVideo.title}"
                ></a>
              </td>
              <td
                th:text="${gameVideo.name != null and !#strings.isEmpty(gameVideo.name) ? gameVideo.name : '-'}"
              ></td>
              <td
                th:text="${gameVideo.createdAt != null ? #temporals.format(gameVideo.createdAt, 'yyyy/MM/dd HH:mm') : '-'}"
              ></td>
              <td th:if="${selectMode}" class="text-center">
                <button
                  type="button"
                  class="btn btn-sm btn-dark"
                  th:data-game-video-id="${gameVideo.id}"
                  th:data-game-video-title="${gameVideo.title}"
                  th:data-game-video-name="${gameVideo.name != null and !#strings.isEmpty(gameVideo.name) ? gameVideo.name : '-'}"
                  th:data-game-video-registered-at="${gameVideo.createdAt != null ? #temporals.format(gameVideo.createdAt, 'yyyy/MM/dd') : '-'}"
                >
                  選択
                </button>
              </td>
            </tr>
            <tr th:if="${gameVideoPage.empty}">
              <td
                class="text-center text-muted"
                th:attr="colspan=${selectMode ? 5 : 4}"
              >
                ゲーム動画はありません。
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <script type="module" th:src="@{/js/gameVideo/list.js}"></script>
      <script
        th:if="${selectMode}"
        type="module"
        th:src="@{/js/gameVideo/select.js}"
      ></script>
    </div>
  </body>
</html>
