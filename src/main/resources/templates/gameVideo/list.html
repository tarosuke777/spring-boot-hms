<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>ゲーム動画</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2">ゲーム動画</h1>
      </div>

      <form
        th:action="@{/gameVideo/list}"
        method="get"
        class="card card-body mb-4"
      >
        <div class="row g-3 align-items-end">
          <div class="col-12 col-md-5">
            <label class="form-label" for="game-video-title">タイトル</label>
            <select
              class="form-select"
              id="game-video-title"
              name="title"
              th:data-names-url="@{/gameVideo/names}"
            >
              <option value="">すべてのタイトル</option>
              <option
                th:each="option : ${titles}"
                th:value="${option}"
                th:text="${option}"
                th:selected="${option == title}"
              ></option>
            </select>
          </div>
          <div class="col-12 col-md-5">
            <label class="form-label" for="game-video-name">名前</label>
            <select class="form-select" id="game-video-name" name="name">
              <option value="">すべての名前</option>
              <option
                th:each="option : ${names}"
                th:value="${option}"
                th:text="${option}"
                th:selected="${option == name}"
              ></option>
            </select>
          </div>
          <div class="col-12 col-md-2">
            <button type="submit" class="btn btn-dark">検索</button>
            <a th:href="@{/gameVideo/list}" class="btn btn-secondary">クリア</a>
          </div>
        </div>
        <p
          id="game-video-filter-error"
          class="text-danger mt-2 mb-0"
          role="alert"
          hidden
        ></p>
      </form>

      <div
        th:replace="~{parts/pagination :: pagination(page=${gameVideoPage})}"
      ></div>

      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr class="table-dark">
              <th>プレビュー</th>
              <th>タイトル</th>
              <th>名前</th>
              <th>登録日時</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="gameVideo : ${gameVideoPage.content}">
              <td>
                <video
                  class="w-100"
                  style="max-width: 320px"
                  controls
                  preload="metadata"
                >
                  <source th:src="${gameVideo.videoUrl}" type="video/mp4" />
                  お使いのブラウザーは動画再生に対応していません。
                </video>
              </td>
              <td>
                <a
                  class="text-decoration-none"
                  th:href="@{/gameVideo/detail/{id}(id=${gameVideo.id})}"
                  th:text="${gameVideo.title}"
                ></a>
              </td>
              <td
                th:text="${gameVideo.name != null and !#strings.isEmpty(gameVideo.name) ? gameVideo.name : '-'}"
              ></td>
              <td
                th:text="${gameVideo.createdAt != null ? #temporals.format(gameVideo.createdAt, 'yyyy/MM/dd HH:mm') : '-'}"
              ></td>
            </tr>
            <tr th:if="${gameVideoPage.empty}">
              <td colspan="4" class="text-center text-muted">
                ゲーム動画はありません。
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <script type="module" th:src="@{/js/gameVideo/list.js}"></script>
    </div>
  </body>
</html>
