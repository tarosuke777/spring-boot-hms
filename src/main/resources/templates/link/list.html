<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>リンク一覧</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2">リンク一覧</h1>
      </div>

      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <!-- Chat -->
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">チャット</h5>
              <p class="card-text text-muted">
                自宅コミュニケーションおよびチャットシステム。
              </p>
              <a
                href="/hc/"
                target="hc_chat"
                rel="noopener noreferrer"
                class="btn btn-outline-dark btn-sm stretched-link"
                >チャットを開く</a
              >
            </div>
          </div>
        </div>

        <!-- Blog -->
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">ブログ</h5>
              <p class="card-text text-muted">自宅ブログおよび技術メモ。</p>
              <a
                href="/hb/"
                target="hb_blog"
                rel="noopener noreferrer"
                class="btn btn-outline-dark btn-sm stretched-link"
                >ブログを開く</a
              >
            </div>
          </div>
        </div>

        <!-- Videos -->
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">動画</h5>
              <p class="card-text text-muted">
                動画ポータルおよびメディアリソース。
              </p>
              <a
                href="/hv/videos/"
                target="hv_videos"
                rel="noopener noreferrer"
                class="btn btn-outline-dark btn-sm stretched-link"
                >動画を開く</a
              >
            </div>
          </div>
        </div>

        <!-- Books -->
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">書籍</h5>
              <p class="card-text text-muted">書籍管理およびドキュメント。</p>
              <a
                href="/hv/books/"
                target="hv_books"
                rel="noopener noreferrer"
                class="btn btn-outline-dark btn-sm stretched-link"
                >書籍を開く</a
              >
            </div>
          </div>
        </div>

        <!-- Jenkins -->
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Jenkins</h5>
              <p class="card-text text-muted">CI/CD自動化サーバー。</p>
              <a
                href="/jenkins/"
                target="jenkins"
                rel="noopener noreferrer"
                class="btn btn-outline-dark btn-sm stretched-link"
                >Jenkinsを開く</a
              >
            </div>
          </div>
        </div>

        <!-- Grafana -->
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Grafana</h5>
              <p class="card-text text-muted">
                監視・メトリクスダッシュボード。
              </p>
              <a
                href="/grafana/"
                target="grafana"
                rel="noopener noreferrer"
                class="btn btn-outline-dark btn-sm stretched-link"
                >Grafanaを開く</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
