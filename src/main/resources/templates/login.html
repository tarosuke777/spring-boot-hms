<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  layout:decorate="~{layout/layout}"
>
  <head>
    <th:block layout:fragment="page-scripts">
      <script type="module" th:src="@{/js/login.js}"></script>
    </th:block>

    <title>Login</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  </head>

  <body>
    <div layout:fragment="content">
      <div class="container">
        <div class="card text-center mt-5">
          <div class="card-header text-bg-dark">
            <h1 class="h4">Login</h1>
          </div>
          <div class="card-body">
            <form method="post" th:action="@{/login}">
              <p th:if="${param.error}" class="error">
                UserName or Password is incorrect.
              </p>
              <div class="mb-3">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Name"
                  name="userName"
                />
              </div>
              <div class="mb-3">
                <input
                  type="password"
                  class="form-control"
                  placeholder="Password"
                  name="password"
                />
              </div>
              <div class="mb-3">
                <input type="submit" value="login" class="btn btn-dark" />
              </div>
            </form>

            <hr class="my-4" />

            <div
              id="passkey-error"
              class="alert alert-danger mb-3"
              style="display: none"
            ></div>

            <div class="mb-3">
              <button
                type="button"
                id="passkey-login-btn"
                class="btn btn-outline-dark w-100"
                th:data-options-url="@{/webauthn/authenticate/options}"
                th:data-login-url="@{/login/webauthn}"
                th:data-redirect-url="@{/top}"
              >
                <i class="bi bi-shield-lock"></i> パスキーでログイン
              </button>
            </div>

            <a th:href="@{/user/signup}">SignUp</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
