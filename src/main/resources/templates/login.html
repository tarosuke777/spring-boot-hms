<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>Login</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  </head>

  <body>
    <div layout:fragment="content">
      <div class="container">
        <div class="card text-center mt-5">
          <div class="card-header text-bg-dark">
            <h1 class="h4">Login</h1>
          </div>
          <div class="card-body">
            <form method="post" th:action="@{/login}">
              <p th:if="${param.error}" class="error">
                UserName or Password is incorrect.
              </p>
              <div class="mb-3">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Name"
                  name="userName"
                />
              </div>
              <div class="mb-3">
                <input
                  type="password"
                  class="form-control"
                  placeholder="Password"
                  name="password"
                />
              </div>
              <div class="mb-3">
                <input type="submit" value="login" class="btn btn-dark" />
              </div>
            </form>

            <hr class="my-4" />

            <div
              id="passkey-error"
              class="alert alert-danger mb-3"
              style="display: none"
            ></div>

            <!-- ★ パスキーログインボタンの追加 -->
            <div class="mb-3">
              <button
                type="button"
                id="passkey-login-btn"
                class="btn btn-outline-dark w-100"
              >
                <i class="bi bi-shield-lock"></i> パキーでログイン
              </button>
            </div>

            <a th:href="@{/user/signup}">SignUp</a>
          </div>
        </div>
      </div>

      <!-- パスキー操作用のWebAuthnヘルパーライブラリ (CDN) -->
      <script src="https://cdn.jsdelivr.net/npm/@github/webauthn-json@2.1.1/dist/browser-global/webauthn-json.browser-global.min.js"></script>

      <script>
        document
          .getElementById("passkey-login-btn")
          .addEventListener("click", async () => {
            const errorElement = document.getElementById("passkey-error");
            errorElement.style.display = "none";

            // ライブラリの参照（webauthnJSON または window.WebAuthnJson を取得）
            const webauthnLib = window.webauthnJSON || window.WebAuthnJson;
            if (!webauthnLib) {
              alert(
                "WebAuthn ライブラリの読み込みに失敗しました。ページを再読み込みしてください。"
              );
              return;
            }

            // CSRFトークンの取得
            const token = document
              .querySelector("meta[name='_csrf']")
              ?.getAttribute("content");
            const header = document
              .querySelector("meta[name='_csrf_header']")
              ?.getAttribute("content");

            const headers = {
              "Content-Type": "application/json",
            };
            if (token && header) {
              headers[header] = token;
            }

            try {
              // 1. チャレンジ（Options）をサーバーから取得
              const optionsRes = await fetch(
                "/hms/webauthn/authenticate/options",
                {
                  method: "POST",
                  headers: headers,
                }
              );

              if (!optionsRes.ok) {
                const errorText = await optionsRes.text();
                console.error("HTTP Error:", optionsRes.status, errorText);
                throw new Error("オプションの取得に失敗しました");
              }
              const options = await optionsRes.json();

              // 2. ブラウザの Passkey 認証プロンプトを表示
              const credential = await webauthnLib.get({
                publicKey: options,
              });

              // 3. 認証結果を Spring Security へ送信
              const loginRes = await fetch("/hms/login/webauthn", {
                method: "POST",
                headers: headers,
                body: JSON.stringify(credential),
              });

              if (loginRes.ok) {
                // ログイン成功時に /top へリダイレクト（SecurityConfigで指定した先）
                window.location.href = "/hms/top";
              } else {
                errorElement.innerText = "パスキー認証に失敗しました。";
                errorElement.style.display = "block";
              }
            } catch (err) {
              console.error("Passkey Error:", err);
              // ユーザーがキャンセルした場合などをケア
              if (err.name !== "NotAllowedError") {
                errorElement.innerText = "パスキーの呼び出しに失敗しました。";
                errorElement.style.display = "block";
              }
            }
          });
      </script>
    </div>
  </body>
</html>
