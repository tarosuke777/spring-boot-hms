<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>動画</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2 mb-3">動画管理</h1>

        <!-- タブメニュー -->
        <ul class="nav nav-pills">
          <li class="nav-item">
            <a
              class="nav-link active bg-dark text-white"
              th:href="@{/movie/list}"
              >動画</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link text-dark" th:href="@{/cast/list}">キャスト</a>
          </li>
        </ul>
      </div>

      <div>
        <div class="mb-2">
          <a class="btn btn-dark" th:href="@{'/movie/register'}">新規登録</a>
        </div>

        <div
          th:replace="~{parts/pagination :: pagination(page=${moviePage})}"
        ></div>

        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr class="table-dark">
              <th>ジャンル</th>
              <th>タイトル</th>
              <th>キャスト</th>
              <th>リンク</th>
              <th>備考</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="movie: ${moviePage.content}">
              <td th:text="${movie.genre.label}"></td>
              <td>
                <a
                  th:href="@{'/movie/detail/' + ${movie.id}}"
                  th:text="${movie.name}"
                  class="text-decoration-none"
                ></a>
                <span th:if="${movie.isAdult}" class="badge bg-danger ms-1"
                  >18+</span
                >
              </td>
              <td>
                <a
                  th:if="${movie.castId != null}"
                  th:href="@{/cast/detail/{id}(id=${movie.castId})}"
                  class="btn btn-sm btn-link"
                  th:text="${castMap.get(movie.castId)}"
                  >リンク</a
                >
                <span th:unless="${movie.castId != null}">-</span>
              </td>
              <td class="text-center">
                <a
                  th:if="${not #strings.isEmpty(movie.link)}"
                  th:href="${movie.link}"
                  target="_blank"
                  class="btn btn-sm btn-link"
                  >リンク</a
                >
                <span th:unless="${not #strings.isEmpty(movie.link)}">-</span>
              </td>
              <td style="white-space: pre-line" th:text="${movie.note}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
