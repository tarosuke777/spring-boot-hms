<nav
  th:fragment="pagination(page)"
  th:if="${page != null and page.totalPages > 1}"
  aria-label="Page navigation"
  th:with="
    current=${page.number},
    total=${page.totalPages},
    start=${current == 0 ? 0 : (current == total - 1 ? T(java.lang.Math).max(0, total - 3) : T(java.lang.Math).max(0, current - 1))},
    end=${current == 0 ? T(java.lang.Math).min(total - 1, 2) : (current == total - 1 ? total - 1 : T(java.lang.Math).min(total - 1, current + 1))}"
>
  <ul class="pagination">
    <!-- 1. 前へボタン -->
    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
      <a class="page-link" hms:page-href="${current - 1}" aria-label="Previous">
        &lsaquo; 前へ
      </a>
    </li>

    <!-- 2. 先頭「1」ページ目（中央の範囲に含まれない場合のみ表示） -->
    <li class="page-item" th:if="${start > 0}">
      <a class="page-link" hms:page-href="0">1</a>
    </li>

    <!-- 3. 前側の「...」（1ページ目とstartの間に隙間がある場合のみ表示） -->
    <li class="page-item disabled" th:if="${start > 1}">
      <span class="page-link">&hellip;</span>
    </li>

    <!-- 4. メインの数字エリア -->
    <li
      class="page-item"
      th:each="i : ${#numbers.sequence(start, end)}"
      th:classappend="${i == current} ? 'active'"
    >
      <a class="page-link" hms:page-href="${i}" th:text="${i + 1}">1</a>
    </li>

    <!-- 5. 後ろ側の「...」（endと最終ページの間に隙間がある場合のみ表示） -->
    <li class="page-item disabled" th:if="${end < total - 2}">
      <span class="page-link">&hellip;</span>
    </li>

    <!-- 6. 最終ページ（中央の範囲に含まれない場合のみ表示） -->
    <li class="page-item" th:if="${end < total - 1}">
      <a class="page-link" hms:page-href="${total - 1}" th:text="${total}"
        >400</a
      >
    </li>

    <!-- 7. 次へボタン -->
    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
      <a class="page-link" hms:page-href="${current + 1}" aria-label="Next">
        次へ &rsaquo;
      </a>
    </li>
  </ul>
</nav>
