<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Parts</title>
  </head>

  <body>
    <nav
      th:fragment="pagination(page)"
      th:if="${page != null and page.totalPages > 1}"
      aria-label="Page navigation"
    >
      <ul class="pagination">
        <!-- 前へボタン -->
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
          <a
            class="page-link"
            hms:page-href="${page.number - 1}"
            aria-label="Previous"
            >&laquo;</a
          >
        </li>

        <!-- ページ番号 -->
        <li
          class="page-item"
          th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
          th:classappend="${i == page.number} ? 'active'"
        >
          <a class="page-link" hms:page-href="${i}" th:text="${i + 1}">1</a>
        </li>

        <!-- 次へボタン -->
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
          <a
            class="page-link"
            hms:page-href="${page.number + 1}"
            aria-label="Next"
            >&raquo;</a
          >
        </li>
      </ul>
    </nav>
  </body>
</html>
