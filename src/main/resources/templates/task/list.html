<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <th:block layout:fragment="page-css">
      <link rel="stylesheet" th:href="@{/css/task/list.css}" />
    </th:block>

    <th:block layout:fragment="page-scripts">
      <script type="module" th:src="@{/js/task/list.js}"></script>
    </th:block>

    <title>タスク一覧</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2 mb-3">タスク管理</h1>
      </div>

      <div class="row align-items-center mb-4 g-3">
        <div class="col-auto">
          <a class="btn btn-dark" th:href="@{'/task/register'}">新規登録</a>
        </div>
        <div class="col">
          <form
            th:action="@{/task/list}"
            method="get"
            class="row g-2 align-items-center"
            th:object="${taskForm}"
          >
            <!-- ステータス検索用プルダウン -->
            <div class="col-auto">
              <select class="form-select" th:field="*{searchStatus}">
                <option
                  th:each="g : ${T(com.tarosuke777.hms.enums.TaskStatus).values()}"
                  th:value="${g}"
                  th:text="${g.label}"
                ></option>
              </select>
            </div>

            <!-- カテゴリ検索用プルダウン -->
            <div class="col-auto">
              <select class="form-select" th:field="*{searchCategory}">
                <option value="">すべてのカテゴリ</option>
                <option
                  th:each="cat : ${T(com.tarosuke777.hms.enums.TaskCategory).values()}"
                  th:value="${cat}"
                  th:text="${cat.label}"
                ></option>
              </select>
            </div>

            <div class="col-auto">
              <button type="submit" class="btn btn-dark">検索</button>
              <a th:href="@{/task/list}" class="btn btn-secondary">リセット</a>
            </div>
          </form>
        </div>
      </div>

      <div th:if="${#lists.isEmpty(tasks)}">
        <p>タスクが見つかりませんでした。</p>
      </div>
      <div th:unless="${#lists.isEmpty(tasks)}">
        <div id="task-container" class="row">
          <div
            class="col-md-4 mb-4"
            draggable="true"
            th:each="task : ${tasks}"
            th:id="${'task-' + task.id}"
          >
            <div class="card h-100">
              <form
                method="post"
                th:action="@{/task/update}"
                th:id="${'updateForm-' + task.id}"
              >
                <input type="hidden" name="id" th:value="${task.id}" />
                <input
                  type="hidden"
                  name="version"
                  th:value="${task.version}"
                />
                <input
                  type="hidden"
                  name="searchStatus"
                  th:value="${taskForm.searchStatus}"
                />
                <input
                  type="hidden"
                  name="searchCategory"
                  th:value="${taskForm.searchCategory}"
                />
                <div class="card-header">
                  <input
                    type="text"
                    name="name"
                    class="form-control"
                    th:value="${task.name}"
                  />
                </div>
                <div class="card-body">
                  <textarea
                    name="note"
                    class="form-control"
                    rows="5"
                    th:text="${task.note}"
                  ></textarea>

                  <!-- <select name="status" class="form-select mt-2">
                    <option
                      th:each="status : ${T(com.tarosuke777.hms.enums.TaskStatus).values()}"
                      th:value="${status}"
                      th:text="${status.label}"
                      th:selected="${task.status == status}"
                    ></option>
                  </select> -->

                  <div class="row g-1 mt-2 mb-2">
                    <div class="col-6">
                      <select name="status" class="form-select form-select-sm">
                        <option
                          th:each="status : ${T(com.tarosuke777.hms.enums.TaskStatus).values()}"
                          th:value="${status}"
                          th:text="${status.label}"
                          th:selected="${task.status == status}"
                        ></option>
                      </select>
                    </div>

                    <div class="col-6">
                      <select
                        name="category"
                        class="form-select form-select-sm"
                      >
                        <option
                          th:each="cat : ${T(com.tarosuke777.hms.enums.TaskCategory).values()}"
                          th:value="${cat}"
                          th:text="${cat.label}"
                          th:selected="${task.category == cat}"
                        ></option>
                      </select>
                    </div>
                  </div>

                  <div class="row g-1 mb-2">
                    <div class="col-6">
                      <select
                        name="importance"
                        class="form-select form-select-sm"
                      >
                        <option value="">重要度: 未設定</option>
                        <option
                          th:each="imp : ${T(com.tarosuke777.hms.enums.PriorityLevel).values()}"
                          th:value="${imp}"
                          th:text="'重要度: ' + ${imp.label}"
                          th:selected="${task.importance == imp}"
                        ></option>
                      </select>
                    </div>
                    <div class="col-6">
                      <select name="urgency" class="form-select form-select-sm">
                        <option value="">緊急度: 未設定</option>
                        <option
                          th:each="urg : ${T(com.tarosuke777.hms.enums.PriorityLevel).values()}"
                          th:value="${urg}"
                          th:text="'緊急度: ' + ${urg.label}"
                          th:selected="${task.urgency == urg}"
                        ></option>
                      </select>
                    </div>
                  </div>
                </div>
              </form>
              <div class="card-footer text-center">
                <button
                  type="submit"
                  class="btn btn-primary btn-sm"
                  th:form="${'updateForm-' + task.id}"
                >
                  更新する
                </button>
                <form
                  method="post"
                  th:action="@{/task/delete}"
                  style="display: inline-block"
                >
                  <input type="hidden" name="id" th:value="${task.id}" />
                  <input
                    type="hidden"
                    name="searchStatus"
                    th:value="${taskForm.searchStatus}"
                  />
                  <input
                    type="hidden"
                    name="searchCategory"
                    th:value="${taskForm.searchCategory}"
                  />
                  <button
                    type="submit"
                    class="btn btn-danger btn-sm"
                    onclick="
                      return confirm(
                        '本当にこのタスクを削除しますか？',
                      );
                    "
                  >
                    削除する
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script></script>
      <style></style>
    </div>
  </body>
</html>
