<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>タスク登録</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-3 border-bottom">
        <h1 class="h2">タスク登録</h1>
      </div>
      <form method="post" th:action="@{/task/create}" th:object="${taskForm}">
        <div class="mb-3 row">
          <label for="name" class="col-sm-2 col-form-label">タスク名</label>
          <div class="col-sm-10">
            <input
              type="text"
              class="form-control"
              th:field="*{name}"
              th:errorclass="is-invalid"
            />
            <div class="invalid-feedback" th:errors="*{name}"></div>
          </div>
        </div>

        <div class="mb-3 row">
          <label for="category" class="col-sm-2 col-form-label">分類</label>
          <div class="col-sm-10">
            <select
              class="form-select"
              th:field="*{category}"
              th:errorclass="is-invalid"
            >
              <option value="" disabled selected>選択してください</option>
              <option
                th:each="cat : ${T(com.tarosuke777.hms.enums.TaskCategory).values()}"
                th:value="${cat}"
                th:text="${cat.label}"
              ></option>
            </select>
            <div class="invalid-feedback" th:errors="*{category}"></div>
          </div>
        </div>

        <div class="mb-3 row">
          <label for="importance" class="col-sm-2 col-form-label">重要度</label>
          <div class="col-sm-10">
            <select
              class="form-select"
              th:field="*{importance}"
              th:errorclass="is-invalid"
            >
              <option value="">未設定</option>
              <option
                th:each="imp : ${T(com.tarosuke777.hms.enums.PriorityLevel).values()}"
                th:value="${imp}"
                th:text="${imp.label}"
              ></option>
            </select>
            <div class="invalid-feedback" th:errors="*{importance}"></div>
          </div>
        </div>

        <div class="mb-3 row">
          <label for="urgency" class="col-sm-2 col-form-label">緊急度</label>
          <div class="col-sm-10">
            <select
              class="form-select"
              th:field="*{urgency}"
              th:errorclass="is-invalid"
            >
              <option value="">未設定</option>
              <option
                th:each="urg : ${T(com.tarosuke777.hms.enums.PriorityLevel).values()}"
                th:value="${urg}"
                th:text="${urg.label}"
              ></option>
            </select>
            <div class="invalid-feedback" th:errors="*{urgency}"></div>
          </div>
        </div>

        <div class="mb-3 row">
          <label for="note" class="col-sm-2 col-form-label">備考</label>
          <div class="col-sm-10">
            <textarea
              class="form-control"
              rows="5"
              th:field="*{note}"
            ></textarea>
          </div>
        </div>
        <div class="text-center">
          <button class="btn btn-dark" type="submit">登録する</button>
        </div>
      </form>
    </div>
  </body>
</html>
