<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>トレーニング記録詳細</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-3 border-bottom">
        <h1 class="h2">トレーニング記録詳細</h1>
      </div>
      <form
        method="post"
        th:action="@{/training/detail}"
        th:object="${trainingForm}"
      >
        <input type="hidden" th:field="*{trainingId}" />
        <input type="hidden" th:field="*{version}" />
        <div class="mb-3 row">
          <label for="trainingName" class="col-sm-2 col-form-label"
            >実施日</label
          >
          <div class="col-sm-10">
            <input
              type="text"
              class="form-control"
              th:field="*{trainingDate}"
            />
          </div>
        </div>
        <div class="mb-3 row">
          <label for="trainingMenuName" class="col-sm-2 col-form-label"
            >種目名</label
          >
          <div
            class="col-sm-10"
            th:insert="~{parts/parts :: commonSelect(${trainingMenuMap}, trainingMenuId, 'trainingMenuId', true)}"
          ></div>
        </div>
        <div class="mb-3 row">
          <label for="weight" class="col-sm-2 col-form-label">重量(kg)</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" th:field="*{weight}" />
          </div>
        </div>
        <div class="mb-3 row">
          <label for="reps" class="col-sm-2 col-form-label">回数</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" th:field="*{reps}" />
          </div>
        </div>
        <div class="mb-3 row">
          <label for="sets" class="col-sm-2 col-form-label">セット数</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" th:field="*{sets}" />
          </div>
        </div>
        <div class="text-center">
          <button class="btn btn-danger" type="submit" name="delete">
            削除する
          </button>
          <button class="btn btn-dark" type="submit" name="update">
            更新する
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
