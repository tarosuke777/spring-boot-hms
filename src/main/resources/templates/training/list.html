<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>Training</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2 mb-3">Training Management</h1>

        <!-- タブメニュー -->
        <ul class="nav nav-pills">
          <li class="nav-item">
            <a
              class="nav-link active bg-dark text-white"
              th:href="@{/training/list}"
              >Training</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link text-dark" th:href="@{/trainingMenu/list}"
              >Training Menu</a
            >
          </li>
        </ul>
      </div>
      <div>
        <div class="mb-2">
          <a class="btn btn-dark" th:href="@{'/training/register'}">Register</a>
        </div>
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr class="table-dark">
              <th>
                <a
                  th:href="@{/training/list(orderBy='training_date', sort='asc')}"
                  >▲</a
                >
                Training Date
                <a
                  th:href="@{/training/list(orderBy='training_date', sort='desc')}"
                  >▼</a
                >
              </th>
              <th>Training Area Name</th>
              <th>Training Menu Name</th>
              <th>Weight</th>
              <th>Reps</th>
              <th>Sets</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="training: ${trainingList}">
              <td>
                <a
                  th:href="@{'/training/detail/' + ${training.trainingId}}"
                  th:text="${#temporals.format(training.trainingDate, 'yyyy-MM-dd (E)')}"
                  class="text-decoration-none"
                ></a>
              </td>
              <td
                th:text="${training.trainingAreaId != null ? trainingAreaMap.get(training.trainingAreaId) : ''}"
              ></td>
              <td
                th:text="${training.trainingMenuId != null ? trainingMenuMap.get(training.trainingMenuId) : ''}"
              ></td>
              <td th:text="${training.weight}"></td>
              <td th:text="${training.reps}"></td>
              <td th:text="${training.sets}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
