<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>種目詳細</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-3 border-bottom">
        <h1 class="h2">種目詳細</h1>
      </div>
      <form
        method="post"
        th:action="@{/trainingMenu/detail}"
        th:object="${trainingMenuForm}"
      >
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3 row">
          <label for="name" class="col-sm-2 col-form-label">種目名</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" th:field="*{name}" />
          </div>
        </div>
        <div class="mb-3 row">
          <label for="targetAreaName" class="col-sm-2 col-form-label"
            >部位</label
          >
          <div
            class="col-sm-10"
            th:insert="~{parts/parts :: commonSelect(${targetAreaMap}, targetAreaId, 'targetAreaId', true)}"
          ></div>
        </div>
        <div class="mb-3 row">
          <label for="link" class="col-sm-2 col-form-label">リンク</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" th:field="*{link}" />
          </div>
        </div>
        <div class="mb-3 row">
          <label for="maxWeigth" class="col-sm-2 col-form-label"
            >最高重量</label
          >
          <div class="col-sm-10">
            <input type="text" class="form-control" th:field="*{maxWeight}" />
          </div>
        </div>
        <div class="mb-3 row">
          <label for="maxReps" class="col-sm-2 col-form-label">最高回数</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" th:field="*{maxReps}" />
          </div>
        </div>
        <div class="mb-3 row">
          <label for="maxSets" class="col-sm-2 col-form-label"
            >最高セット数</label
          >
          <div class="col-sm-10">
            <input type="text" class="form-control" th:field="*{maxSets}" />
          </div>
        </div>
        <div class="text-center">
          <button class="btn btn-danger" type="submit" name="delete">
            削除する
          </button>
          <button class="btn btn-dark" type="submit" name="update">
            更新する
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
