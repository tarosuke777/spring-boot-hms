<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>TrainingMenu</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-4 border-bottom pb-2">
        <h1 class="h2 mb-3">Training Management</h1>

        <!-- タブメニュー -->
        <ul class="nav nav-pills">
          <li class="nav-item">
            <a class="nav-link text-dark" th:href="@{/training/list}"
              >Training</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link active bg-dark text-white"
              th:href="@{/trainingMenu/list}"
              >Training Menu</a
            >
          </li>
        </ul>
      </div>
      <div>
        <div class="mb-2">
          <a class="btn btn-dark" th:href="@{'/trainingMenu/register'}"
            >新規登録</a
          >
        </div>
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr class="table-dark">
              <th>Training Menu Name</th>
              <th>Target Area Name</th>
              <th>Link</th>
              <th>Max Weight</th>
              <th>Max Reps</th>
              <th>Max Sets</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="trainingMenu: ${trainingMenuList}">
              <td>
                <a
                  th:href="@{'/trainingMenu/detail/' + ${trainingMenu.id}}"
                  th:text="${trainingMenu.name}"
                  class="text-decoration-none"
                ></a>
              </td>
              <td
                th:text="${trainingMenu.targetAreaId != null ? targetAreaMap.get(trainingMenu.targetAreaId) : ''}"
              ></td>
              <td th:text="${trainingMenu.link}"></td>
              <td th:text="${trainingMenu.maxWeight}"></td>
              <td th:text="${trainingMenu.maxReps}"></td>
              <td th:text="${trainingMenu.maxSets}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
