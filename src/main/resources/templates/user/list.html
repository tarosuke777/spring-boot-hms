<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>ユーザ一覧</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="mt-3 mb-3 border-bottom">
        <h1 class="h2">ユーザ一覧</h1>
      </div>
      <div>
        <div class="mb-2">
          <a class="btn btn-dark" th:href="@{'/user/signup'}">新規登録</a>
        </div>
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr class="table-dark">
              <th>ID</th>
              <th>ユーザー名</th>
              <th>ロール</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="user: ${userList}">
              <td th:text="${user.id}"></td>
              <td>
                <a
                  th:href="@{'/user/detail/' + ${user.id}}"
                  th:text="${user.name}"
                  class="text-decoration-none"
                ></a>
              </td>
              <td th:text="${user.role.displayName}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
